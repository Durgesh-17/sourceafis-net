name: Build Standalone Linux CLI

on:
  push:
    branches: [ master, main ]
  workflow_dispatch: # Allows manual trigger via the GitHub UI

jobs:
  build-executable:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Auto-Generate Console Wrapper Application
        run: |
          dotnet new console -n FingerprintCli -o ./FingerprintCli
          cd FingerprintCli
          dotnet add package SourceAFIS --version 3.14.0
          
          cat << 'EOF' > Program.cs
          using System;
          using System.IO;
          using SourceAFIS;

          class Program
          {
              static int Main(string[] args)
              {
                  try
                  {
                      using (var stdin = Console.OpenStandardInput())
                      using (var reader = new BinaryReader(stdin))
                      {
                          // Read Image 1 Metadata & Raw Pixels
                          int width1 = reader.ReadInt32();
                          int height1 = reader.ReadInt32();
                          int len1 = width1 * height1;
                          byte[] pixels1 = reader.ReadBytes(len1);

                          // Read Image 2 Metadata & Raw Pixels
                          int width2 = reader.ReadInt32();
                          int height2 = reader.ReadInt32();
                          int len2 = width2 * height2;
                          byte[] pixels2 = reader.ReadBytes(len2);

                          // Process directly via SourceAFIS raw grayscale engine
                          var image1 = new FingerprintImage(width1, height1, pixels1);
                          var image2 = new FingerprintImage(width2, height2, pixels2);

                          var template1 = new FingerprintTemplate(image1);
                          var template2 = new FingerprintTemplate(image2);

                          var matcher = new FingerprintMatcher(template1);
                          double score = matcher.Match(template2);

                          // Print only the final numeric score to stdout for easy Python parsing
                          Console.Write(score.ToString("F2"));
                          return 0;
                      }
                  }
                  catch (Exception ex)
                  {
                      Console.Error.WriteLine($"Error: {ex.Message}");
                      return 1;
                  }
              }
          }
          EOF

      - name: Compile to Single Standalone Linux File
        run: |
          cd FingerprintCli
          dotnet publish -c Release \
                         -r linux-x64 \
                         --self-contained true \
                         -p:PublishSingleFile=true \
                         -p:PublishTrimmed=true \
                         -o ../dist-output

      - name: Upload Finished Executable Asset
        uses: actions/upload-artifact@v4
        with:
          name: native-linux-cli
          path: ./dist-output/FingerprintCli
